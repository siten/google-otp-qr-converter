[package]
name = "google-otp-qr-converter"
version = "0.1.0"
edition = "2024"
description = "Offline Google Authenticator QR migration and OTP QR utility"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
data-encoding = "2.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
prost = "0.14"
percent-encoding = "2.3"
qrcodegen = "1.8"
rqrr = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
